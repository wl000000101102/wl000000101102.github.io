<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0a1612">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="撲克帳本">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>撲克帳本</title>
<style>
:root{--bg:#0a1612;--bg2:#10231c;--card:rgba(255,255,255,.055);--card2:rgba(255,255,255,.09);--line:rgba(255,255,255,.12);--ink:#eef0ea;--muted:#9fb0a7;--gold:#f3c957;--gold2:#d9a52a;--green:#39d98a;--red:#ff6b7a;--blue:#6cb8ff;--purple:#b48cff;--safe-t:env(safe-area-inset-top);--safe-b:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.5;overscroll-behavior-y:none}
body{background-image:radial-gradient(900px 500px at 10% -10%,rgba(57,217,138,.22),transparent 60%),radial-gradient(700px 400px at 100% 0%,rgba(243,201,87,.14),transparent 55%);min-height:100vh;padding-bottom:calc(84px + var(--safe-b))}
button,input,select{font:inherit}
.hdr{position:sticky;top:0;z-index:20;padding:calc(10px + var(--safe-t)) 18px 10px;display:flex;align-items:center;gap:10px;background:rgba(10,22,18,.9);border-bottom:1px solid var(--line)}
.hdr .logo{width:30px;height:30px;border-radius:50%;background:conic-gradient(var(--gold) 0 25%,#fff 0 50%,var(--gold) 0 75%,#fff 0);position:relative;flex:0 0 30px}
.hdr .logo::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--bg2);border:2px solid var(--gold)}
.hdr h1{margin:0;font-size:1.15em;font-weight:900;letter-spacing:.02em}
.hdr .sp{flex:1}
.hdr .pill{font-size:.78em;padding:4px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--muted)}
main{padding:14px 16px 0;max-width:720px;margin:0 auto}
.view{display:none;animation:fade .35s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 16px;margin:0 0 14px;box-shadow:0 10px 30px rgba(0,0,0,.25);position:relative;overflow:hidden}
.card h2{margin:0 0 10px;font-size:.95em;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.card h2 .em{font-size:1.2em;margin-right:4px}
.big{font-size:2.4em;font-weight:900;line-height:1.1;letter-spacing:-.01em}
.gold{color:var(--gold)}.green{color:var(--green)}.red{color:var(--red)}.muted{color:var(--muted)}.blue{color:var(--blue)}
.sub{font-size:.85em;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.kpi .v{font-size:1.35em;font-weight:900;color:var(--gold);line-height:1.2}
.kpi .l{font-size:.75em;color:var(--muted)}
.kpi .s{font-size:.72em;color:var(--muted);margin-top:2px}
.kpi.green .v{color:var(--green)}.kpi.red .v{color:var(--red)}.kpi.blue .v{color:var(--blue)}.kpi.purple .v{color:var(--purple)}
/* bankroll tank */
.tank{display:flex;gap:16px;align-items:center}
.tank-wrap{width:110px;height:140px;flex:0 0 110px;border-radius:18px;border:2px solid rgba(243,201,87,.5);position:relative;overflow:hidden;background:rgba(0,0,0,.25)}
.tank-fill{position:absolute;left:0;right:0;bottom:0;height:0%;transition:height 1.2s cubic-bezier(.2,.8,.2,1);background:linear-gradient(180deg,rgba(57,217,138,.9),rgba(26,127,79,.95))}
.tank-wave{position:absolute;left:-50%;width:200%;height:24px;top:-12px;background:radial-gradient(circle at 10px 12px,rgba(255,255,255,.35) 6px,transparent 7px) 0 0/40px 24px repeat-x;opacity:.5;animation:wave 3s linear infinite}
@keyframes wave{to{transform:translateX(40px)}}
.tank-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;text-shadow:0 2px 6px rgba(0,0,0,.5)}
.tank-label b{font-size:1.5em}
.tank-label small{font-size:.72em;font-weight:600;opacity:.9}
.lvl{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:linear-gradient(135deg,rgba(243,201,87,.35),rgba(243,201,87,.08));border:1px solid rgba(243,201,87,.6);font-weight:900;font-size:1.35em;color:var(--gold);box-shadow:0 0 24px rgba(243,201,87,.25);animation:glow 3s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 18px rgba(243,201,87,.2)}50%{box-shadow:0 0 34px rgba(243,201,87,.45)}}
.bar{height:10px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;margin:8px 0 4px}
.bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--green),var(--gold));width:0;transition:width 1s cubic-bezier(.2,.8,.2,1);position:relative}
.bar>i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:shine 2.2s linear infinite}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.msg{margin:8px 0 0;padding:9px 12px;border-radius:12px;font-size:.88em;line-height:1.55}
.msg.ok{background:rgba(57,217,138,.12);border:1px solid rgba(57,217,138,.35)}
.msg.warn{background:rgba(255,140,66,.14);border:1px solid rgba(255,140,66,.45)}
.msg.info{background:var(--card2);border:1px solid var(--line)}
.ring{width:84px;height:84px;flex:0 0 84px;position:relative}
.ring svg{transform:rotate(-90deg);width:84px;height:84px}
.ring .bg{fill:none;stroke:rgba(255,255,255,.1);stroke-width:8}
.ring .fg{fill:none;stroke:var(--gold);stroke-width:8;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.ring .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;line-height:1.1}
.ring .t small{font-size:.65em;color:var(--muted);font-weight:600}
.flame{font-size:1.6em;display:inline-block;animation:flicker 1.2s ease-in-out infinite alternate}
@keyframes flicker{from{transform:scale(1) rotate(-3deg)}to{transform:scale(1.12) rotate(3deg)}}
.fab{position:fixed;right:18px;bottom:calc(92px + var(--safe-b));width:62px;height:62px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1200;font-size:32px;font-weight:900;box-shadow:0 12px 30px rgba(243,201,87,.45);z-index:25;cursor:pointer;transition:transform .15s}
.fab:active{transform:scale(.92)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(10,22,18,.95);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--safe-b));z-index:24}
.tabs button{flex:1;border:none;background:none;color:var(--muted);padding:6px 4px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72em;font-weight:700;cursor:pointer}
.tabs button .ic{font-size:1.55em;line-height:1;transition:transform .2s}
.tabs button.on{color:var(--gold)}
.tabs button.on .ic{transform:translateY(-3px) scale(1.15)}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.25s;z-index:30}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg2);border-radius:22px 22px 0 0;padding:14px 18px calc(20px + var(--safe-b));transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:31;box-shadow:0 -10px 40px rgba(0,0,0,.5)}
.sheet.on{transform:none}
.sheet .grab{width:44px;height:5px;border-radius:999px;background:rgba(255,255,255,.25);margin:0 auto 10px}
.sheet h3{margin:4px 0 10px;font-size:1.15em}
.field{margin:10px 0}
.field label{display:block;font-size:.8em;color:var(--muted);margin-bottom:5px;font-weight:700}
.field input[type=number],.field input[type=date],.field input[type=text]{width:100%;padding:12px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--ink);font-size:1.1em;color-scheme:dark}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card2);color:var(--ink);cursor:pointer;font-weight:700;transition:.15s}
.chip.on{background:var(--gold);color:#1a1200;border-color:transparent;transform:scale(1.06)}
.chip.big{font-size:1.3em;padding:6px 12px}
.stepper{display:flex;gap:8px;align-items:center}
.stepper input{flex:1;text-align:center}
.stepper button{width:52px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--gold);font-size:1.1em;font-weight:900;cursor:pointer}
.wl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wl button{padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--card2);color:var(--ink);font-weight:900;font-size:1.05em;cursor:pointer}
.wl button.win.on{border-color:var(--green);background:rgba(57,217,138,.2);color:var(--green)}
.wl button.loss.on{border-color:var(--red);background:rgba(255,107,122,.2);color:var(--red)}
.btn{width:100%;padding:14px;border-radius:14px;border:none;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1200;font-weight:900;font-size:1.1em;cursor:pointer;margin-top:8px}
.btn.ghost{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:rgba(255,107,122,.18);color:var(--red);border:1px solid rgba(255,107,122,.4)}
.btn:active{transform:scale(.98)}
/* list */
.sess{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.sess:last-child{border-bottom:none}
.sess .ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.85em;flex:0 0 42px}
.sess .ic.w{background:rgba(57,217,138,.18);color:var(--green)}.sess .ic.l{background:rgba(255,107,122,.18);color:var(--red)}
.sess .m{flex:1;min-width:0}
.sess .m b{display:block}
.sess .m small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess .r{text-align:right;font-weight:900}
.sess .r small{display:block;color:var(--muted);font-weight:600}
.chart{width:100%;height:auto;display:block}
.heat{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.heat i{display:block;aspect-ratio:1;border-radius:3px;background:rgba(255,255,255,.07)}
.heat i.l1{background:rgba(57,217,138,.3)}.heat i.l2{background:rgba(57,217,138,.55)}.heat i.l3{background:rgba(57,217,138,.8)}.heat i.l4{background:var(--gold)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.badge{text-align:center;padding:8px 4px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-size:.68em;color:var(--muted);line-height:1.3}
.badge .e{font-size:1.9em;display:block;filter:grayscale(1);opacity:.4;margin-bottom:2px}
.badge.on{border-color:rgba(243,201,87,.6);color:var(--ink);background:linear-gradient(180deg,rgba(243,201,87,.2),var(--card2))}
.badge.on .e{filter:none;opacity:1;animation:pop .6s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{transform:scale(.4)}60%{transform:scale(1.2)}to{transform:scale(1)}}
.insight{padding:10px 12px;border-radius:12px;background:var(--card2);border-left:4px solid var(--gold);margin:8px 0;font-size:.9em;line-height:1.55}
.insight.good{border-color:var(--green)}.insight.bad{border-color:var(--red)}.insight.neutral{border-color:var(--blue)}
.table{width:100%;border-collapse:collapse;font-size:.86em}
.table th,.table td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.table th{color:var(--muted);font-weight:700}
.scroll{overflow-x:auto}
.toast{position:fixed;left:50%;bottom:calc(150px + var(--safe-b));transform:translate(-50%,20px);background:#1f2e27;color:#fff;padding:12px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:.3s;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:90vw;text-align:center;font-weight:700}
.toast.on{opacity:1;transform:translate(-50%,0)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.celebrate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:45;pointer-events:none;opacity:0;transition:.3s}
.celebrate.on{opacity:1}
.celebrate div{background:rgba(10,22,18,.92);border:1px solid rgba(243,201,87,.6);border-radius:22px;padding:22px 28px;text-align:center;box-shadow:0 0 60px rgba(243,201,87,.4);animation:pop .7s}
.celebrate .e{font-size:3em}
.celebrate b{display:block;font-size:1.3em;color:var(--gold);margin-top:6px}
.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.count{font-variant-numeric:tabular-nums}
.file{display:none}
hr.sep{border:none;border-top:1px solid var(--line);margin:12px 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="hdr"><div class="logo"></div><h1>撲克帳本</h1><span class="sp"></span><span class="pill" id="hdr-date"></span></header>
<main>
 <section class="view on" id="v-home"></section>
 <section class="view" id="v-stats"></section>
 <section class="view" id="v-insight"></section>
 <section class="view" id="v-settings"></section>
</main>
<button class="fab" id="fab" aria-label="記一場">＋</button>
<nav class="tabs">
 <button data-v="home" class="on"><span class="ic">🏠</span>首頁</button>
 <button data-v="stats"><span class="ic">📊</span>統計</button>
 <button data-v="insight"><span class="ic">🧠</span>分析</button>
 <button data-v="settings"><span class="ic">⚙️</span>設定</button>
</nav>
<div class="sheet-bg" id="sheet-bg"></div>
<div class="sheet" id="sheet">
 <div class="grab"></div>
 <h3 id="sheet-title">記一場 🃏</h3>
 <form id="f" autocomplete="off">
  <input type="hidden" id="f-id">
  <div class="field"><label>打的級別</label><div class="chips" id="f-level"></div></div>
  <div class="grid2">
   <div class="field"><label>日期</label><input type="date" id="f-date" required></div>
   <div class="field"><label>時段</label><div class="chips" id="f-slot"></div></div>
  </div>
  <div class="field"><label>手數</label><div class="stepper"><button type="button" data-d="-100">−100</button><input type="number" id="f-hands" min="0" step="1" inputmode="numeric" placeholder="0" required><button type="button" data-d="100">+100</button></div></div>
  <div class="field"><label>打了幾分鐘</label><div class="stepper"><button type="button" data-m="-15">−15</button><input type="number" id="f-min" min="0" step="1" inputmode="numeric" placeholder="90"><button type="button" data-m="15">+15</button></div></div>
  <div class="field"><label>結果</label><div class="wl"><button type="button" class="win" id="f-win">😎 贏了</button><button type="button" class="loss" id="f-loss">😤 輸了</button></div></div>
  <div class="field"><label>金額（美元，不用寫正負）</label><input type="number" id="f-amt" min="0" step="0.01" inputmode="decimal" placeholder="例如 1.5" required></div>
  <div class="grid2">
   <div class="field"><label>EV 結果（美元，選填）</label><input type="number" id="f-ev" step="0.01" inputmode="decimal" placeholder="PokerCraft"></div>
   <div class="field"><label>桌數</label><input type="number" id="f-tables" min="1" max="12" step="1" value="2" inputmode="numeric"></div>
  </div>
  <div class="field"><label>今天的狀態</label><div class="chips" id="f-mood"></div></div>
  <div class="field"><label>有 tilt 嗎？（情緒影響決策）</label><div class="chips" id="f-tilt"><span class="chip on" data-v="0">🧊 沒有</span><span class="chip" data-v="1">🔥 有一點</span></div></div>
  <div class="field"><label>一句話（要復盤的事）</label><input type="text" id="f-note" maxlength="140" placeholder="例如：轉牌被 x/r 棄兩次，要查"></div>
  <button type="submit" class="btn" id="f-save">儲存這一場 ✨</button>
  <button type="button" class="btn ghost" id="f-cancel">取消</button>
  <button type="button" class="btn danger" id="f-del" style="display:none">刪除這一場</button>
 </form>
</div>
<div class="toast" id="toast"></div>
<canvas id="confetti"></canvas>
<div class="celebrate" id="celebrate"><div><span class="e" id="cel-e">🎉</span><b id="cel-t"></b><span class="sub" id="cel-s"></span></div></div>
<script>
(function(){
'use strict';
const KEY='pokerTracker.v1';
const LEVELS=[{n:'NL2',bb:0.02,bi:2,entry:0,drop:null},{n:'NL5',bb:0.05,bi:5,entry:150,drop:100},{n:'NL10',bb:0.10,bi:10,entry:400,drop:300},{n:'NL25',bb:0.25,bi:25,entry:1000,drop:750},{n:'NL50',bb:0.50,bi:50,entry:2000,drop:1500},{n:'NL100',bb:1,bi:100,entry:4000,drop:3000}];
const SLOTS=['早上','下午','晚上','深夜'];
const MOODS=['😴 累','😐 普通','🙂 好','🔥 超好'];
const GATES=[['階段 1',20000],['階段 2',50000],['階段 3',80000],['階段 4',100000]];
const $=id=>document.getElementById(id);
const pad=n=>(n<10?'0':'')+n;
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const addDays=(ds,n)=>{const d=new Date(ds+'T00:00:00');d.setDate(d.getDate()+n);return iso(d);};
const daysBetween=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);
const weekStart=ds=>{const d=new Date(ds+'T00:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d);};
const fmt=(x,d=0)=>{const s=Math.abs(+x||0).toFixed(d).split('.');s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');return ((+x||0)<0?'-':'')+s.join('.');};
const money=x=>((+x||0)<0?'-':'')+'$'+fmt(Math.abs(+x||0),2);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lvl=n=>LEVELS.find(l=>l.n===n)||LEVELS[0];
const hasEv=s=>s.ev!==null&&s.ev!==undefined&&s.ev!==''&&!isNaN(+s.ev);
const defaults=()=>({settings:{startBankroll:100,startDate:today(),weeklyGoal:3000,fx:true},sessions:[],adjustments:[],lastBackup:null,badges:[]});
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&d.sessions){d.adjustments=d.adjustments||[];d.settings=Object.assign(defaults().settings,d.settings||{});d.badges=d.badges||[];return d;}}catch(e){}return defaults();}
let D=load();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){toast('儲存失敗：'+e.message);}}
const sorted=()=>D.sessions.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.id-b.id);
const bankroll=()=>D.sessions.reduce((b,s)=>b+(+s.result||0),+D.settings.startBankroll||0)+D.adjustments.reduce((b,a)=>b+(+a.amount||0),0);

/* ---------- stats ---------- */
function stats(){
 const ss=sorted();const t={hands:0,result:0,ev:0,evHands:0,minutes:0,sessions:ss.length,bb:0,evbb:0,byLevel:{},tilt30:0,breaches:0,best:null,worst:null,days:{},wins:0,losses:0,byWeekday:Array.from({length:7},()=>({bb:0,hands:0,n:0})),bySlot:{},tilt:{y:{bb:0,hands:0,n:0},n:{bb:0,hands:0,n:0}},byLen:{short:{bb:0,hands:0,n:0},mid:{bb:0,hands:0,n:0},long:{bb:0,hands:0,n:0}},byMood:{},resultsBI:[]};
 const cutoff=addDays(today(),-30);let peak=+D.settings.startBankroll||0,cur=peak,dd=0,ddBI=0;let wStreak=0,lStreak=0,maxW=0,maxL=0;
 ss.forEach(s=>{const L=lvl(s.level),h=+s.hands||0,r=+s.result||0,rb=r/L.bb;
  t.hands+=h;t.result+=r;t.minutes+=+s.minutes||0;t.bb+=rb;if(r>=0)t.wins++;else t.losses++;
  if(hasEv(s)){t.ev+=+s.ev;t.evHands+=h;t.evbb+=(+s.ev)/L.bb;}
  const b=t.byLevel[s.level]||(t.byLevel[s.level]={hands:0,result:0,bb:0,ev:0,evbb:0,evHands:0,sessions:0,minutes:0});
  b.hands+=h;b.result+=r;b.bb+=rb;b.sessions++;b.minutes+=+s.minutes||0;if(hasEv(s)){b.ev+=+s.ev;b.evbb+=(+s.ev)/L.bb;b.evHands+=h;}
  if(s.tilt&&s.date>=cutoff)t.tilt30++;if(r<=-5*L.bi)t.breaches++;
  if(!t.best||r>+t.best.result)t.best=s;if(!t.worst||r<+t.worst.result)t.worst=s;
  t.days[s.date]=(t.days[s.date]||0)+h;
  const wd=(new Date(s.date+'T00:00:00').getDay()+6)%7;t.byWeekday[wd].bb+=rb;t.byWeekday[wd].hands+=h;t.byWeekday[wd].n++;
  if(s.slot){const o=t.bySlot[s.slot]||(t.bySlot[s.slot]={bb:0,hands:0,n:0});o.bb+=rb;o.hands+=h;o.n++;}
  const tk=s.tilt?'y':'n';t.tilt[tk].bb+=rb;t.tilt[tk].hands+=h;t.tilt[tk].n++;
  const m=+s.minutes||0;const lk=m<=60?'short':m<=120?'mid':'long';if(m){t.byLen[lk].bb+=rb;t.byLen[lk].hands+=h;t.byLen[lk].n++;}
  if(s.mood){const o=t.byMood[s.mood]||(t.byMood[s.mood]={bb:0,hands:0,n:0});o.bb+=rb;o.hands+=h;o.n++;}
  t.resultsBI.push(r/L.bi);
  cur+=r;if(cur>peak)peak=cur;const d=peak-cur;if(d>dd){dd=d;ddBI=d/L.bi;}
  if(r>=0){wStreak++;lStreak=0;}else{lStreak++;wStreak=0;}maxW=Math.max(maxW,wStreak);maxL=Math.max(maxL,lStreak);});
 const rate=o=>o.hands?o.bb/o.hands*100:null;
 t.bb100=rate(t);t.evbb100=t.evHands?t.evbb/t.evHands*100:null;
 for(const k in t.byLevel){const b=t.byLevel[k];b.bb100=rate(b);b.evbb100=b.evHands?b.evbb/b.evHands*100:null;}
 t.hourly=t.minutes?t.result/(t.minutes/60):null;t.ci=t.hands?1.96*100/Math.sqrt(t.hands/100):null;
 const wk=weekStart(today()),mon=today().slice(0,7);t.weekHands=0;t.monthHands=0;t.todayHands=t.days[today()]||0;t.weekResult=0;t.monthResult=0;
 ss.forEach(s=>{if(s.date>=wk){t.weekHands+=+s.hands||0;t.weekResult+=+s.result||0;}if(s.date.slice(0,7)===mon){t.monthHands+=+s.hands||0;t.monthResult+=+s.result||0;}});
 t.activeDays=Object.keys(t.days).length;t.avgPerDay=t.activeDays?t.hands/t.activeDays:0;
 let st=0,d=today();if(!t.days[d])d=addDays(d,-1);while(t.days[d]){st++;d=addDays(d,-1);}t.streak=st;
 t.lastLevel=ss.length?ss[ss.length-1].level:null;t.maxDD=dd;t.maxDDBI=ddBI;t.maxWin=maxW;t.maxLoss=maxL;t.curW=wStreak;t.curL=lStreak;
 t.last10=ss.slice(-10);t.last10bb=t.last10.reduce((a,s)=>a+(+s.result||0)/lvl(s.level).bb,0);t.last10hands=t.last10.reduce((a,s)=>a+(+s.hands||0),0);
 t.rate=rate;return t;}

function recommend(bank,t){let idx=0;for(let i=0;i<LEVELS.length;i++)if(bank>=LEVELS[i].entry)idx=i;const msgs=[];
 if(idx>=3){const nl10=t.byLevel['NL10'];const wr=nl10?(nl10.evbb100!==null?nl10.evbb100:nl10.bb100):null;const ok=!!nl10&&nl10.hands>=50000&&wr!==null&&wr>=3;
  if(!ok&&idx===3){msgs.push({c:'warn',m:`資金已到 NL25 門檻，但還需要 NL10 累計 50k 手且 EV ≥ 3 bb/100（目前 ${fmt(nl10?nl10.hands:0)} 手、${wr===null?'—':fmt(wr,1)} bb/100）。先留在 NL10。`});idx=2;}}
 const li=LEVELS.findIndex(l=>l.n===t.lastLevel);
 if(li>idx){if(LEVELS[li].drop!==null&&bank>=LEVELS[li].drop){idx=li;msgs.push({c:'info',m:`最近在打 ${t.lastLevel}，資金還在降級線 $${LEVELS[li].drop} 之上，可以留著。`});}
  else msgs.push({c:'warn',m:`最近在打 ${t.lastLevel}，但資金已低於它的降級線 $${LEVELS[li].drop}。請退回 ${LEVELS[idx].n}，不要存款補。`});}
 const L=LEVELS[idx],bis=bank/L.bi;
 if(bis<20)msgs.push({c:'warn',m:`只有 ${fmt(bis,1)} 個買入，低於 20，破產風險很高。手數比結果重要。`});
 if(idx===0&&bank<50)msgs.push({c:'warn',m:'資金低於 $50。教材規則：停打兩週只做研究與 Trainer，這是漏洞不是變異數。'});
 return {level:L,next:LEVELS[idx+1]||null,bis,msgs,idx};}

 const span=next?next.entry-L.entry:L.bi*40;const p=next?Math.min(100,Math.max(0,(bank-L.entry)/span*100)):100;
 const goal=+D.settings.weeklyGoal||3000;const dayGoal=Math.round(goal/6);const dp=Math.min(100,t.todayHands/dayGoal*100);const wp=Math.min(100,t.weekHands/goal*100);

  <div class="row" style="margin-top:10px;justify-content:space-between"><span><span class="flame">${t.streak>=3?'🔥':'🕯️'}</span> 連續 <b class="count">${t.streak}</b> 天有記錄</span><span class="sub">本週 <span class="${t.weekResult>=0?'green':'red'}">${money(t.weekResult)}</span></span></div></div>`;
 h+=`<div class="card"><h2><span class="em">⚡</span>快速數字</h2><div class="grid3">${kpi('總手數',fmt(t.hands),t.sessions+' 場')}${kpi('勝率',t.bb100===null?'—':fmt(t.bb100,1),'bb/100 ±'+(t.ci===null?'—':fmt(t.ci,0)),t.bb100>=0?'green':'red')}${kpi('時薪',t.hourly===null?'—':money(t.hourly),'每小時','blue')}</div></div>`;

function sessRow(s){const r=+s.result||0;return `<div class="sess" data-id="${s.id}"><div class="ic ${r>=0?'w':'l'}">${s.level}</div><div class="m"><b>${s.date} · ${fmt(s.hands)} 手${s.minutes?' · '+s.minutes+' 分':''}</b><small>${s.slot?s.slot+' · ':''}${s.mood?s.mood+' · ':''}${s.tilt?'🔥 tilt · ':''}${esc(s.note)||'—'}</small></div><div class="r ${r>=0?'green':'red'}">${money(r)}<small>${hasEv(s)?'EV '+money(+s.ev):''}</small></div></div>`;}

 if(keys.length)h+=`<div class="card"><h2><span class="em">🎚</span>各級別</h2><div class="scroll"><table class="table"><thead><tr><th>級別</th><th>手數</th><th>結果</th><th>bb/100</th><th>EV</th><th>場</th><th>時</th></tr></thead><tbody>${keys.map(k=>{const b=t.byLevel[k];return `<tr><td><b>${k}</b></td><td>${fmt(b.hands)}</td><td class="${b.result>=0?'green':'red'}">${money(b.result)}</td><td>${b.bb100===null?'—':fmt(b.bb100,1)}</td><td>${b.evbb100===null?'—':fmt(b.evbb100,1)}</td><td>${b.sessions}</td><td>${fmt(b.minutes/60,1)}</td></tr>`;}).join('')}</tbody></table></div></div>`;

function lineChart(){const ss=sorted();const ev=[];ss.forEach(s=>ev.push({date:s.date,amt:+s.result||0,id:s.id}));D.adjustments.forEach(a=>ev.push({date:a.date,amt:+a.amount||0,id:a.id}));ev.sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:x.id-y.id);
 let b=+D.settings.startBankroll||0;const pts=[b];ev.forEach(e=>{b+=e.amt;pts.push(b);});if(pts.length<2)return '<div class="sub">記兩場以上就會有走勢圖</div>';
 const W=600,H=220,P=30;let mn=Math.min(...pts),mx=Math.max(...pts);if(mx===mn){mx+=1;mn-=1;}const pd=(mx-mn)*.12;mn-=pd;mx+=pd;
 const sx=i=>P+(W-2*P)*i/(pts.length-1),sy=v=>H-P-(H-2*P)*(v-mn)/(mx-mn);
 const d=pts.map((v,i)=>(i?'L':'M')+sx(i).toFixed(1)+','+sy(v).toFixed(1)).join(' ');const area=d+` L${sx(pts.length-1).toFixed(1)},${H-P} L${P},${H-P} Z`;const s0=sy(+D.settings.startBankroll||0);
 return `<svg class="chart" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#39d98a" stop-opacity=".45"/><stop offset="1" stop-color="#39d98a" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#g)"/><line x1="${P}" y1="${s0.toFixed(1)}" x2="${W-P}" y2="${s0.toFixed(1)}" stroke="rgba(255,255,255,.3)" stroke-dasharray="4 4"/><path d="${d}" fill="none" stroke="#f3c957" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s ease forwards"/><circle cx="${sx(pts.length-1).toFixed(1)}" cy="${sy(pts[pts.length-1]).toFixed(1)}" r="6" fill="#f3c957"><animate attributeName="r" values="5;8;5" dur="1.6s" repeatCount="indefinite"/></circle><text x="${P}" y="${P-10}" fill="#9fb0a7" font-size="12">最高 ${money(Math.max(...pts))}</text><text x="${P}" y="${H-P+18}" fill="#9fb0a7" font-size="12">最低 ${money(Math.min(...pts))}</text><text x="${W-P}" y="${H-P+18}" fill="#f3c957" font-size="12" text-anchor="end" font-weight="700">現在 ${money(b)}</text><style>@keyframes draw{to{stroke-dashoffset:0}}</style></svg>`;}
function barChart(t){const days=[];for(let i=27;i>=0;i--)days.push(addDays(today(),-i));const vals=days.map(d=>t.days[d]||0);const mx=Math.max(1,...vals);const tot=vals.reduce((a,b)=>a+b,0);const W=600,H=150,P=26,bw=(W-2*P)/28;
 return `<div class="sub">合計 ${fmt(tot)} 手 · 單日最多 ${fmt(mx)}</div><svg class="chart" viewBox="0 0 ${W} ${H}">${vals.map((v,i)=>{const bh=(H-2*P)*v/mx;return `<rect x="${(P+i*bw+1).toFixed(1)}" y="${(H-P-bh).toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${Math.max(bh,2).toFixed(1)}" rx="3" fill="${v?(i===27?'#f3c957':'#39d98a'):'rgba(255,255,255,.08)'}"><animate attributeName="height" from="0" to="${Math.max(bh,2).toFixed(1)}" dur=".8s" fill="freeze"/><animate attributeName="y" from="${H-P}" to="${(H-P-bh).toFixed(1)}" dur=".8s" fill="freeze"/></rect>`;}).join('')}<text x="${P}" y="${H-P+16}" fill="#9fb0a7" font-size="11">${days[0].slice(5)}</text><text x="${W-P}" y="${H-P+16}" fill="#9fb0a7" font-size="11" text-anchor="end">今天</text></svg>`;}
function heatmap(t){const goal=+D.settings.weeklyGoal||3000;const dayGoal=Math.round(goal/6);const start=addDays(weekStart(today()),-77);const cells=[];for(let w=0;w<12;w++){for(let d=0;d<7;d++){const ds=addDays(start,w*7+d);const v=t.days[ds]||0;let c='';if(v>0)c=v>=dayGoal*2?'l4':v>=dayGoal?'l3':v>=dayGoal/2?'l2':'l1';if(ds>today())c='';cells.push({ds,v,c});}}
 // layout: columns=weeks, rows=weekdays -> grid with 12 columns and 7 rows
 let h='<div class="heat">';for(let d=0;d<7;d++){for(let w=0;w<12;w++){const cell=cells[w*7+d];h+=`<i class="${cell.c}" title="${cell.ds} ${cell.v} 手"></i>`;}}h+='</div>';return h;}

function renderInsight(t){const bank=bankroll();const r=recommend(bank,t);const ins=[];
 const n=t.sessions;

 // projection
 if(r.next&&t.hands>=2000&&t.bb100!==null){const wr=t.evbb100!==null?t.evbb100:t.bb100;const need=r.next.entry-bank;if(need>0){if(wr>0){const bbNeed=need/r.level.bb;const handsNeed=bbNeed/wr*100;const days=t.avgPerDay?handsNeed/t.avgPerDay:null;ins.push({c:'good',m:`升級預估：以目前勝率 ${fmt(wr,1)} bb/100 與每個打牌日 ${fmt(t.avgPerDay)} 手，升到 ${r.next.n} 還需要約 ${fmt(handsNeed)} 手${days?'（約 '+fmt(days)+' 個打牌日）':''}。變異數會讓實際差很多，當作方向就好。`});}

 // tilt
 const ty=t.tilt.y,tn=t.tilt.n;if(ty.n>=3&&tn.n>=3){const a=t.rate(ty),b=t.rate(tn);ins.push({c:a<b?'bad':'good',m:`tilt 的影響：有 tilt 的 ${ty.n} 場勝率 ${fmt(a,1)} bb/100，沒 tilt 的 ${tn.n} 場 ${fmt(b,1)} bb/100。${a<b?'差 '+fmt(b-a,1)+' bb/100。出現 tilt 早期信號就停，這是最便宜的改善。':'目前看不出 tilt 傷害，但樣本小，繼續誠實記。'}`});}

 // length
 const bl=t.byLen;const lens=['short','mid','long'].filter(k=>bl[k].n>=3);if(lens.length>=2){const best=lens.reduce((a,k)=>t.rate(bl[k])>t.rate(bl[a])?k:a);const worst=lens.reduce((a,k)=>t.rate(bl[k])<t.rate(bl[a])?k:a);const nm={short:'60 分鐘以內',mid:'61–120 分鐘',long:'超過 120 分鐘'};ins.push({c:worst==='long'?'bad':'neutral',m:`場次長度：${nm[best]} 的場次最好（${fmt(t.rate(bl[best]),1)} bb/100），${nm[worst]} 最差（${fmt(t.rate(bl[worst]),1)}）。${worst==='long'?'打太久會變差，教材建議一場 90–120 分鐘就休息。':''}`});}

function countUp(root){if(D.settings.fx===false)return;root.querySelectorAll('.count').forEach(el=>{const txt=el.textContent;const m=txt.match(/-?[\d,]+(\.\d+)?/);if(!m)return;const target=parseFloat(m[0].replace(/,/g,''));if(isNaN(target))return;const dec=(m[0].split('.')[1]||'').length;const pre=txt.slice(0,m.index),post=txt.slice(m.index+m[0].length);const t0=performance.now(),dur=900;function step(now){const p=Math.min(1,(now-t0)/dur);const e=1-Math.pow(1-p,3);el.textContent=pre+fmt(target*e,dec)+post;if(p<1)requestAnimationFrame(step);else el.textContent=txt;}requestAnimationFrame(step);});}

function celebrateSave(s,t,before,after,fresh){const fx=D.settings.fx!==false;const win=+s.result>=0;
 if(after.idx>before){cel('🚀','升級！現在可以打 '+after.level.n,'資金階梯說的，不是手感說的。買入 $'+after.level.bi+'，停損 $'+(3*after.level.bi)+' / $'+(5*after.level.bi));if(fx){confetti(220);buzz([30,40,30,40,80]);}return;}
 if(after.idx<before){toast('⚠ 資金低於降級線，現在該打 '+after.level.n);if(fx)buzz([60,40,60]);return;}
 if(fresh.length){cel(fresh[0].e,'成就解鎖：'+fresh[0].n,fresh[0].t);if(fx){confetti(160);buzz([20,30,20]);}return;}
 if(win){toast(WIN_MSG[Math.floor(Math.random()*WIN_MSG.length)]);if(fx){confetti(+s.result>=3*lvl(s.level).bi?200:90);buzz([15,30,15]);}}
 else{toast(LOSS_MSG[Math.floor(Math.random()*LOSS_MSG.length)]);if(fx){document.querySelector('.hdr').classList.add('shake');setTimeout(()=>document.querySelector('.hdr').classList.remove('shake'),600);buzz(20);}}
 if(t.streak>=3&&t.streak%7===0)setTimeout(()=>toast('🔥 連續 '+t.streak+' 天記錄！'),1600);}
function cel(e,title,sub){$('cel-e').textContent=e;$('cel-t').textContent=title;$('cel-s').textContent=sub||'';const c=$('celebrate');c.classList.add('on');setTimeout(()=>c.classList.remove('on'),2600);}
let toastT;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2200);}
function buzz(p){if(D.settings.fx===false)return;try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
function confetti(n){const cv=$('confetti');const ctx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;const cols=['#f3c957','#39d98a','#ffffff','#ff6b7a','#6cb8ff'];const ps=[];for(let i=0;i<n;i++)ps.push({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,g:.35+Math.random()*.2,s:4+Math.random()*6,c:cols[i%cols.length],r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,sym:Math.random()<.25?'♠♥♦♣'[i%4]:null});
 const t0=performance.now();function frame(now){const el=(now-t0)/1000;ctx.clearRect(0,0,cv.width,cv.height);let alive=false;ps.forEach(p=>{p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;if(p.y<cv.height+20)alive=true;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.globalAlpha=Math.max(0,1-el/2.2);ctx.fillStyle=p.c;if(p.sym){ctx.font=(p.s*2.2)+'px serif';ctx.fillText(p.sym,-p.s,p.s);}else ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);ctx.restore();});if(alive&&el<2.4)requestAnimationFrame(frame);else ctx.clearRect(0,0,cv.width,cv.height);}requestAnimationFrame(frame);}

/* ---------- boot ---------- */
render();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').then(reg=>{reg.addEventListener('updatefound',()=>{const nw=reg.installing;if(!nw)return;nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller){const t=$('toast');t.textContent='有新版本，點一下更新';t.classList.add('on');t.style.pointerEvents='auto';t.onclick=()=>location.reload();}});});}).catch(()=>{});}
})();
</script>
